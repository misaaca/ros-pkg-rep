# ROS Official Package Repository Configuration
# Location on target ROS system: /etc/pkg/sources.list or /etc/pkg/repo.conf

[repository]
name = "ros-official"
enabled = true
url = "https://raw.githubusercontent.com/misaaca/ros-pkg-rep/main"
branch = "main"
arch = "x86_64"
components = ["python", "nodejs", "rust", "system", "kernel"]

# Checksum & Verification Policies
verify_checksum = true
hash_algorithm = "sha256"
index_filename = "Packages.toml"
fallback_index = "Packages.json"

# Cache & Download settings
cache_dir = "/var/cache/pkg"
timeout_seconds = 30
max_retries = 3
